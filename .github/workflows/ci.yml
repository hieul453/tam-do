name: Kiểm tra

# Chạy trên mọi pull request và mọi push vào main.
# Mục đích: không ai — kể cả AI — merge được code hỏng hay nội dung lệch khuôn
# vào bản live.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      # Để trước tiên: lỗi nội dung là lỗi người soạn nội dung hay gặp nhất,
      # và thông báo của bước này viết bằng tiếng Việt, chỉ rõ bài nào thiếu gì.
      - name: Kiểm tra nội dung bài học
        run: npm run content:check

      - name: Kiểm tra định dạng code
        run: npm run format:check

      - name: Kiểm tra kiểu dữ liệu
        run: npm run typecheck

      - name: Chạy test
        run: npm test

      - name: Thử build
        run: npm run build
        env:
          # Giá trị giả, chỉ để build chạy được.
          # Giá trị thật nằm trong Vercel Environment Variables.
          VITE_SUPABASE_URL: https://vi-du.supabase.co
          VITE_SUPABASE_ANON_KEY: khoa-gia-cho-ci
