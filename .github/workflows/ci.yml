name: Kiểm tra

# Chạy trên mọi pull request và mọi push vào main.
# Mục đích: không ai — kể cả AI — merge được code hỏng vào bản live.
# Thêm biến môi trường cho bước build ở đây khi app cần tới chúng.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra định dạng code
        run: npm run format:check

      - name: Kiểm tra kiểu dữ liệu
        run: npm run typecheck

      - name: Chạy test
        run: npm test

      - name: Thử build
        run: npm run build
