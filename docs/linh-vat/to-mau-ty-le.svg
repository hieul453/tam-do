<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" width="1160" height="740"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!--
    TỜ MẪU TỈ LỆ — tài liệu nội bộ cho người duyệt.

    ĐÂY KHÔNG PHẢI ẢNH THAM CHIẾU. Không bao giờ đính kèm file này vào prompt
    sinh ảnh: nó là đường vector hoàn hảo, đúng thứ hợp đồng cấm máy bắt chước,
    và nó có chữ, cũng là thứ bị cấm trong ảnh.

    Nó chỉ nói về SỐ ĐO. Nó không nói gì về nét vẽ, về hình dáng não hay tim,
    về biểu cảm. Khung chữ nhật đứt nét là HỘP BAO, không phải hình thân.

    Dùng để: mở cạnh ảnh nhận về, soi xem tỉ lệ có trôi không.
    Đơn vị: 1 đơn vị = 20px trong file này. Chiều cao thân Não = 10 đơn vị.
  -->
  <defs>
    <marker id="mt" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 4h6M4 1v6" stroke="#1D4ED8" stroke-width="1.2" fill="none" />
    </marker>
  </defs>

  <style>
    .nhan { font-size: 15px; fill: #0B0B12; }
    .nho { font-size: 12.5px; fill: #52525B; }
    .so { font-size: 14px; fill: #1D4ED8; font-weight: 600; }
    .kich { stroke: #1D4ED8; stroke-width: 1.1; fill: none; marker-start: url(#mt); marker-end: url(#mt); }
    .hop { stroke: #0B0B12; stroke-width: 1.3; fill: none; stroke-dasharray: 7 5; opacity: .5; }
    .truc { stroke: #0B0B12; stroke-width: 1.5; fill: none; stroke-linecap: round; opacity: .75; }
    .net { stroke: #0B0B12; stroke-width: 1.6; fill: none; }
    .dat { stroke: #0B0B12; stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .4; }
    .tieu { font-size: 19px; font-weight: 700; fill: #0B0B12; }
  </style>

  <rect width="1160" height="740" fill="#F5F4E9" />

  <text class="tieu" x="40" y="44">Tờ mẫu tỉ lệ — Não và Tim</text>
  <text class="nho" x="40" y="66">
    Khung đo, không phải bản vẽ chuẩn. Nói về số đo; không nói gì về nét vẽ, hình dáng hay biểu cảm.
  </text>
  <text class="nho" x="40" y="86" fill="#B91C1C">
    KHÔNG đính kèm file này vào prompt sinh ảnh — nó là vector hoàn hảo và có chữ, cả hai đều bị cấm trong ảnh.
  </text>

  <!-- bảng màu + đơn vị -->
  <g transform="translate(40, 116)">
    <text class="nho" x="0" y="0">Bảng màu — không thêm màu thứ bảy</text>
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="86" height="26" rx="5" fill="#9097DE" stroke="#0B0B12" stroke-width="1.2" />
      <text class="nho" x="43" y="18" text-anchor="middle" fill="#0B0B12">#9097DE</text>
      <rect x="94" y="0" width="86" height="26" rx="5" fill="#D46B76" stroke="#0B0B12" stroke-width="1.2" />
      <text class="nho" x="137" y="18" text-anchor="middle" fill="#0B0B12">#D46B76</text>
      <rect x="188" y="0" width="86" height="26" rx="5" fill="#9BE5C5" stroke="#0B0B12" stroke-width="1.2" />
      <text class="nho" x="231" y="18" text-anchor="middle" fill="#0B0B12">#9BE5C5</text>
      <rect x="282" y="0" width="86" height="26" rx="5" fill="#0B0B12" stroke="#0B0B12" stroke-width="1.2" />
      <text class="nho" x="325" y="18" text-anchor="middle" fill="#F5F4E9">#0B0B12</text>
      <rect x="376" y="0" width="86" height="26" rx="5" fill="#F5F4E9" stroke="#0B0B12" stroke-width="1.2" />
      <text class="nho" x="419" y="18" text-anchor="middle" fill="#0B0B12">#F5F4E9</text>
      <rect x="470" y="0" width="86" height="26" rx="5" fill="#E0D8C8" stroke="#0B0B12" stroke-width="1.2" />
      <text class="nho" x="513" y="18" text-anchor="middle" fill="#0B0B12">#E0D8C8</text>
    </g>
    <text class="nho" x="580" y="14">Đơn vị: chiều cao thân Não = 10.</text>
    <text class="nho" x="580" y="32">Mọi số trên tờ này tính theo đơn vị đó.</text>
  </g>

  <!-- mặt đất chung -->
  <line class="dat" x1="60" y1="520" x2="1110" y2="520" />

  <!-- ===================== NÃO ===================== -->
  <!-- hộp bao 11.5 × 10 → 230 × 200 ; đáy y=444 ; đỉnh y=244 ; tâm x=350 -->
  <g>
    <ellipse cx="350" cy="520" rx="110" ry="15" fill="#E0D8C8" />
    <rect x="235" y="244" width="230" height="200" rx="14" fill="#9097DE" opacity=".12" />
    <rect class="hop" x="235" y="244" width="230" height="200" rx="14" />

    <!-- trục chân 3.8 → 76 -->
    <line class="truc" x1="305" y1="444" x2="302" y2="520" />
    <line class="truc" x1="395" y1="444" x2="398" y2="520" />
    <!-- trục tay 5.5 → 110, gắn ở 55% chiều cao thân tính từ đáy → y = 444-110 = 334 -->
    <line class="truc" x1="235" y1="334" x2="131" y2="366" />
    <line class="truc" x1="465" y1="334" x2="569" y2="366" />

    <!-- mắt: d 2.6 → 52, tâm cách tâm 4.2 → 84, tâm ở 58% → y = 444-116 = 328 -->
    <circle class="net" cx="308" cy="328" r="26" />
    <circle class="net" cx="392" cy="328" r="26" />
    <circle cx="308" cy="328" r="13" fill="#0B0B12" />
    <circle cx="392" cy="328" r="13" fill="#0B0B12" />
    <!-- tròng kính d 3.6 → 72 -->
    <circle class="net" cx="308" cy="328" r="36" stroke-dasharray="5 4" opacity=".75" />
    <circle class="net" cx="392" cy="328" r="36" stroke-dasharray="5 4" opacity=".75" />

    <text class="nhan" x="350" y="562" text-anchor="middle" font-weight="700">NÃO</text>
    <text class="nho" x="350" y="581" text-anchor="middle">gốc quy chiếu · thân cao = 10</text>
  </g>

  <!-- kích thước Não -->
  <line class="kich" x1="175" y1="244" x2="175" y2="444" />
  <text class="so" x="166" y="272" text-anchor="end">10</text>
  <text class="nho" x="166" y="288" text-anchor="end">thân cao</text>

  <line class="kich" x1="235" y1="214" x2="465" y2="214" />
  <text class="so" x="350" y="206" text-anchor="middle">11.5 · thân rộng</text>

  <text class="nho" x="350" y="256" text-anchor="middle">tâm mắt cách tâm mắt</text>
  <line class="kich" x1="308" y1="276" x2="392" y2="276" />
  <text class="so" x="350" y="268" text-anchor="middle">4.2</text>

  <line class="kich" x1="282" y1="328" x2="334" y2="328" />
  <text class="so" x="308" y="382" text-anchor="middle">2.6 · mắt</text>

  <line class="kich" x1="428" y1="328" x2="500" y2="328" />
  <text class="so" x="508" y="325">3.6</text>
  <text class="nho" x="508" y="340">tròng kính — rộng hơn mắt rõ rệt</text>

  <line class="kich" x1="490" y1="444" x2="490" y2="328" />
  <text class="so" x="500" y="392">58%</text>
  <text class="nho" x="500" y="407">tâm mắt, tính từ đáy thân</text>

  <line class="kich" x1="131" y1="392" x2="235" y2="392" />
  <text class="so" x="183" y="410" text-anchor="middle">5.5 · tay</text>

  <line class="kich" x1="560" y1="444" x2="560" y2="520" />
  <text class="so" x="570" y="486">3.8</text>
  <text class="nho" x="570" y="501">chân</text>

  <!-- ===================== TIM ===================== -->
  <!-- hộp bao 9.6 × 8.8 → 192 × 176 ; đáy y=444 ; đỉnh y=268 ; tâm x=860 -->
  <g>
    <ellipse cx="860" cy="520" rx="95" ry="14" fill="#E0D8C8" />
    <rect x="764" y="268" width="192" height="176" rx="13" fill="#D46B76" opacity=".12" />
    <rect class="hop" x="764" y="268" width="192" height="176" rx="13" />

    <line class="truc" x1="822" y1="444" x2="819" y2="520" />
    <line class="truc" x1="898" y1="444" x2="901" y2="520" />
    <!-- trục tay gắn ở 55% của 176 = 97 → y = 444-97 = 347 -->
    <line class="truc" x1="764" y1="347" x2="660" y2="379" />
    <line class="truc" x1="956" y1="347" x2="1060" y2="379" />

    <!-- mắt GIỐNG HỆT Não: d 52, cách 84. tâm ở 58% của 176 = 102 → y = 444-102 = 342 -->
    <circle class="net" cx="818" cy="342" r="26" />
    <circle class="net" cx="902" cy="342" r="26" />
    <circle cx="818" cy="342" r="13" fill="#0B0B12" />
    <circle cx="902" cy="342" r="13" fill="#0B0B12" />
    <!-- chụp tai d 2.8 → 56 -->
    <circle class="net" cx="764" cy="330" r="28" stroke-dasharray="5 4" opacity=".75" />
    <circle class="net" cx="956" cy="330" r="28" stroke-dasharray="5 4" opacity=".75" />

    <text class="nhan" x="860" y="562" text-anchor="middle" font-weight="700">TIM</text>
    <text class="nho" x="860" y="581" text-anchor="middle">thân bằng 88% Não · mắt bằng 100% Não</text>
  </g>

  <line class="kich" x1="724" y1="268" x2="724" y2="444" />
  <text class="so" x="715" y="296" text-anchor="end">8.8</text>
  <text class="nho" x="715" y="312" text-anchor="end">thân cao</text>

  <line class="kich" x1="764" y1="238" x2="956" y2="238" />
  <text class="so" x="860" y="230" text-anchor="middle">9.6 · thân rộng</text>

  <line class="kich" x1="818" y1="290" x2="902" y2="290" />
  <text class="so" x="860" y="282" text-anchor="middle">4.2</text>

  <line class="kich" x1="792" y1="342" x2="844" y2="342" />
  <text class="so" x="818" y="396" text-anchor="middle">2.6 · mắt</text>

  <line class="kich" x1="992" y1="330" x2="1048" y2="330" />
  <text class="so" x="1056" y="327">2.8</text>
  <text class="nho" x="1056" y="342">chụp tai</text>

  <!-- ===================== hai hộp ghi chú ===================== -->
  <g>
    <rect x="40" y="606" width="560" height="110" rx="10" fill="#FFFFFF" opacity=".45" />
    <rect x="40" y="606" width="560" height="110" rx="10" fill="none" stroke="#0B0B12" stroke-width="1.3" />
    <text class="nhan" x="60" y="629" font-weight="700">Số còn lại — không vẽ trên tờ này</text>
    <text class="nho" x="60" y="651">Nét viền: 0.45 trên cả hai. Gọng kính dày đúng bằng nét viền, không dày hơn.</text>
    <text class="nho" x="60" y="670">Điểm gắn tay: 55% chiều cao thân, tính từ đáy.</text>
    <text class="nho" x="60" y="689">Bóng: ellipse bẹt, rộng 11 (Não) · 9.5 (Tim). Không mờ dần, không đổ theo nguồn sáng.</text>
    <text class="nho" x="60" y="708">Tay 5.5 · chân 3.8 — giống nhau ở cả hai nhân vật.</text>
  </g>

  <g>
    <rect x="620" y="606" width="500" height="110" rx="10" fill="#9097DE" opacity=".16" />
    <rect x="620" y="606" width="500" height="110" rx="10" fill="none" stroke="#0B0B12" stroke-width="1.3" />
    <text class="nhan" x="640" y="629" font-weight="700">Hai chỗ máy trượt nhiều nhất</text>
    <text class="nho" x="640" y="651">1. Thân Tim nhỏ hơn nên máy co luôn mắt theo. Mắt 2.6 và</text>
    <text class="nho" x="640" y="670">khoảng cách 4.2 phải giống hệt nhau ở cả hai — lệch cỡ là trượt.</text>
    <text class="nho" x="640" y="693">2. Tròng kính 3.6 phải rộng hơn mắt 2.6 rõ rệt, hở một vành trắng</text>
    <text class="nho" x="640" y="712">giữa con ngươi và gọng. Dính thành khối đen là tròng quá nhỏ.</text>
  </g>
</svg>
